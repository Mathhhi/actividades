<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">
          <i class="bi bi-cpu"></i>
          TECHSTORE | Panel Administrador
        </span>

        <a href="/logout" class="btn btn-outline-light">
          <i class="bi bi-box-arrow-right"></i>
          Cerrar sesión
        </a>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-dark text-white">
              <h3 class="text-center">
                {{ 'Editar Producto' if editar else 'Registro de Productos' }}
              </h3>
            </div>
            <div class="card-body">
              {% if errores %}
              <div class="alert alert-danger">
                <ul class="mb-0">
                  {% for error in errores %}
                  <li>{{ error }}</li>
                  {% endfor %}
                </ul>
              </div>
              {% endif %}

              <form action="/guardar_producto" method="POST">
                <div class="mb-3">
                  <label class="form-label"> Código </label>
                  <input
                    type="text"
                    name="codigo"
                    class="form-control"
                    required
                    minlength="5"
                    maxlength="20"
                    pattern="P[0-9]+"
                    title="El código debe tener el formato P001."
                    value="{{ datos.codigo if datos else '' }}"
                    oninput="
                      this.value = this.value
                        .trim()
                        .toUpperCase()
                        .replace(/[^A-Z0-9]/g, '')
                    "
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Nombre </label>
                  <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    required
                    minlength="5"
                    maxlength="100"
                    title="El nombre debe tener entre 5 y 100 caracteres."
                    value="{{ datos.nombre if datos else '' }}"
                    oninput="this.value = this.value.trim()"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Precio </label>
                  <input
                    type="text"
                    name="precio"
                    class="form-control"
                    required
                    inputmode="decimal"
                    pattern="\d+(\.\d{1,2})?"
                    title="Ingrese un precio válido, mayor que cero y menor o igual a 5000000."
                    value="{{ datos.precio if datos else '' }}"
                    oninput="
                      this.value = this.value
                        .trim()
                        .replace(/[^0-9.]/g, '')
                        .replace(/(\..*)\./g, '$1')
                    "
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Categoría </label>
                  <input
                    type="text"
                    name="categoria"
                    class="form-control"
                    required
                    title="La categoría es obligatoria."
                    value="{{ datos.categoria if datos else '' }}"
                    oninput="this.value = this.value.trim()"
                  />
                </div>

                <div class="d-grid gap-2">
                  <button class="btn btn-primary">Guardar Producto</button>
                  <a href="/admin" class="btn btn-outline-secondary">
                    Volver al panel de admin
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

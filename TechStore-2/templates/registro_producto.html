<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3 class="text-center">
                            Registrar Producto
                        </h3>
                    </div>
                    <div class="card-body">
                        {% if errores %}
                        <div class="alert alert-danger">
                            <ul class="mb-0">
                                {% for error in errores %}
                                <li>{{ error }}</li>
                                {% endfor %}
                            </ul>
                        </div>
                        {% endif %}
                        <form action="/guardar_producto" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">
                                    Código
                                </label>
                                <input type="text" name="codigo" class="form-control" value="{{ codigo or '' }}" pattern="P[0-9]{3}" minlength="4" maxlength="4" placeholder="P001" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Nombre
                                </label>
                                <input type="text" name="nombre" class="form-control" value="{{ nombre or '' }}" minlength="5" maxlength="100" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Precio
                                </label>
                                <input type="number" step="0.01" min="0.01" max="50000000" name="precio" class="form-control" value="{{ precio or '' }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Categoría
                                </label>
                                <input type="text" name="categoria" class="form-control" value="{{ categoria or '' }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Imagen del producto</label>
                                <input type="file" name="imagen" class="form-control" accept=".png,.jpg,.jpeg,.webp" required>
                            </div>

                            <button class="btn btn-primary w-100">
                                Guardar Producto
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3 class="text-center">
                            {{ 'Editar Producto' if editar else 'Registro de Productos' }}
                        </h3>
                    </div>
                    <div class="card-body">
                        {% if errores %}
                        <div class="alert alert-danger">
                            <ul class="mb-0">
                                {% for error in errores %}
                                <li>{{ error }}</li>
                                {% endfor %}
                            </ul>
                        </div>
                        {% endif %}

                        <form action="/guardar_producto" method="POST">
                            <div class="mb-3">
                                <label class="form-label">
                                    Código
                                </label>
                                <input type="text" name="codigo" class="form-control" required inputmode="numeric" pattern="[0-9]+" title="El código solo debe contener números." value="{{ datos.codigo if datos else '' }}" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Nombre
                                </label>
                                <input type="text" name="nombre" class="form-control" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ .'-]+" title="El nombre no debe contener números." value="{{ datos.nombre if datos else '' }}" oninput="this.value = this.value.replace(/[0-9]/g, '')">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Precio
                                </label>
                                <input type="text" name="precio" class="form-control" required inputmode="decimal" pattern="\d+(\.\d{1,2})?" title="Ingrese un precio válido, sin caracteres especiales ni signos negativos." value="{{ datos.precio if datos else '' }}" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1')">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Categoría
                                </label>
                                <input type="text" name="categoria" class="form-control" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ .'-]+" title="La categoría no debe contener números." value="{{ datos.categoria if datos else '' }}" oninput="this.value = this.value.replace(/[0-9]/g, '')">
                            </div>

                            <button class="btn btn-primary w-100">
                                Guardar Producto
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta | TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand"><i class="bi bi-person-circle me-2"></i>Mi cuenta TechStore</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light"><i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión</a>
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h1 class="h3 mb-1">Hola, {{ usuario.nombre }}</h1>
              <p class="text-muted mb-4">Actualiza los datos de tu cuenta.</p>
              <form method="post">
                <input type="hidden" name="accion" value="datos" />
                <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input id="nombre" name="nombre" class="form-control" value="{{ usuario.nombre }}" required /></div>
                <div class="mb-3"><label class="form-label" for="correo">Correo</label><input id="correo" type="email" class="form-control" value="{{ usuario.correo }}" readonly disabled /></div>
                <div class="mb-4"><label class="form-label" for="telefono">Teléfono</label><input id="telefono" name="telefono" class="form-control" value="{{ usuario.telefono }}" required /></div>
                <button class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Guardar cambios</button>
                <a href="{{ url_for('inicio') }}" class="btn btn-outline-success ms-2"><i class="bi bi-house-door me-1"></i>Ir a la tienda</a>
              </form>
              <hr class="my-4" />
              <h2 class="h5">Cambiar contraseña</h2>
              <form method="post">
                <input type="hidden" name="accion" value="contraseña" />
                <div class="mb-3"><label class="form-label" for="contraseña_actual">Contraseña actual</label><input id="contraseña_actual" type="password" name="contraseña_actual" class="form-control" required /></div>
                <div class="mb-3"><label class="form-label" for="contraseña_nueva">Nueva contraseña</label><input id="contraseña_nueva" type="password" name="contraseña_nueva" class="form-control" minlength="6" required /></div>
                <div class="mb-3"><label class="form-label" for="confirmar_contraseña">Confirmar nueva contraseña</label><input id="confirmar_contraseña" type="password" name="confirmar_contraseña" class="form-control" minlength="6" required /></div>
                <button class="btn btn-warning"><i class="bi bi-key me-1"></i>Cambiar contraseña</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <script>
          {% for category, message in messages %}
            Swal.fire({ icon: {{ ('success' if category == 'success' else 'error') | tojson }}, title: {{ message | tojson }}, confirmButtonText: 'Aceptar' });
          {% endfor %}
        </script>
      {% endif %}
    {% endwith %}
  </body>
</html>

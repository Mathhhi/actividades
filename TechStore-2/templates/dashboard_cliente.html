<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi cuenta | TechStore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('inicio') }}">TECHSTORE</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Cerrar sesión</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-md-7"><div class="card shadow"><div class="card-header bg-primary text-white"><h1 class="h4 mb-0">Dashboard del cliente</h1></div><div class="card-body"><form method="post"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" name="nombre" value="{{ usuario.nombre }}" required></div><div class="mb-3"><label class="form-label">Correo</label><input class="form-control" name="correo" type="email" value="{{ usuario.correo }}" required></div><button class="btn btn-primary" type="submit">Actualizar datos</button></form></div></div></div></div></main>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<script>{% for category, message in messages %}Swal.fire({icon: {{ ('success' if category == 'success' else 'error') | tojson }}, title: {{ message | tojson }}, confirmButtonText: 'Aceptar'});{% endfor %}</script>{% endif %}{% endwith %}</body></html>

<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión | TechStore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card shadow"><div class="card-header bg-dark text-white"><h1 class="h4 mb-0">Iniciar sesión</h1></div><div class="card-body"><form method="post"><div class="mb-3"><label class="form-label" for="correo">Correo</label><input class="form-control" id="correo" name="correo" type="email" required></div><div class="mb-3"><label class="form-label" for="contrasena">Contraseña</label><input class="form-control" id="contrasena" name="contrasena" type="password" required></div><button class="btn btn-primary w-100" type="submit">Ingresar</button></form><p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a href="{{ url_for('registro_usuario') }}">Regístrate</a></p></div></div></div></div></main>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<script>{% for category, message in messages %}Swal.fire({icon: {{ ('success' if category == 'success' else 'error') | tojson }}, title: {{ message | tojson }}, confirmButtonText: 'Aceptar'});{% endfor %}</script>{% endif %}{% endwith %}</body></html>

<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-dark text-white">
              <h3 class="text-center">Editar Producto</h3>
            </div>
            <div class="card-body">
              {% if errores %}
              <div class="alert alert-danger">
                <ul class="mb-0">
                  {% for error in errores %}
                  <li>{{ error }}</li>
                  {% endfor %}
                </ul>
              </div>
              {% endif %}

              <form
                id="form-editar-producto"
                action="/actualizar_producto"
                method="POST"
              >
                <input
                  type="hidden"
                  name="codigo_original"
                  value="{{ producto.codigo }}"
                />

                <div class="mb-3">
                  <label class="form-label">Código</label>
                  <input
                    type="text"
                    name="codigo"
                    class="form-control"
                    value="{{ producto.codigo }}"
                    readonly
                    minlength="5"
                    maxlength="20"
                    pattern="P[0-9]+"
                    title="El código debe tener el formato P001."
                    oninput="
                      this.value = this.value
                        .trim()
                        .toUpperCase()
                        .replace(/[^A-Z0-9]/g, '')
                    "
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    value="{{ producto.nombre }}"
                    required
                    minlength="5"
                    maxlength="100"
                    title="El nombre debe tener entre 5 y 100 caracteres."
                    oninput="this.value = this.value.trim()"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Precio</label>
                  <input
                    type="text"
                    name="precio"
                    class="form-control"
                    value="{{ producto.precio }}"
                    required
                    pattern="\d+(\.\d{1,2})?"
                    title="Ingrese un precio válido, mayor que cero y menor o igual a 5000000."
                    oninput="
                      this.value = this.value
                        .trim()
                        .replace(/[^0-9.]/g, '')
                        .replace(/(\..*)\./g, '$1')
                    "
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Categoría</label>
                  <input
                    type="text"
                    name="categoria"
                    class="form-control"
                    value="{{ producto.categoria }}"
                    required
                    title="La categoría es obligatoria."
                    oninput="this.value = this.value.trim()"
                  />
                </div>

                <button class="btn btn-primary w-100">
                  Actualizar Producto
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("form-editar-producto");
        if (!form) return;

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          Swal.fire({
            title: "¿Actualizar este producto?",
            text: "Se guardarán los cambios realizados.",
            icon: "question",
            showCancelButton: true,
            confirmButtonText: "Sí, actualizar",
            cancelButtonText: "Cancelar",
          }).then((result) => {
            if (result.isConfirmed) {
              form.submit();
            }
          });
        });
      });
    </script>
  </body>
</html>

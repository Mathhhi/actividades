<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear cuenta | TechStore</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card shadow"><div class="card-header bg-primary text-white"><h1 class="h4 mb-0">Crear cuenta de cliente</h1></div><div class="card-body">{% if errores %}<div class="alert alert-danger"><ul class="mb-0">{% for error in errores %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}<form method="post"><div class="mb-3"><label class="form-label">Nombre completo</label><input class="form-control" name="nombre" value="{{ nombre or '' }}" required></div><div class="mb-3"><label class="form-label">Correo</label><input class="form-control" name="correo" type="email" value="{{ correo or '' }}" required></div><div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" name="contrasena" type="password" minlength="8" required></div><button class="btn btn-primary w-100" type="submit">Registrarse</button></form><p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">Volver al inicio de sesión</a></p></div></div></div></div></main></body></html>

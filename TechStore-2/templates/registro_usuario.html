<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">
              <h3>Crear cuenta</h3>
            </div>
            <div class="card-body">
              {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %} {% for category, message in messages %}
              <div
                class="alert alert-{{ 'danger' if category == 'error' else 'success' }}"
              >
                {{ message }}
              </div>
              {% endfor %} {% endif %} {% endwith %}

              <form method="POST" action="/registro_usuario">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Correo</label>
                  <input
                    type="email"
                    name="correo"
                    class="form-control"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="telefono">Teléfono</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input
                      id="telefono"
                      type="tel"
                      name="telefono"
                      class="form-control"
                      placeholder="Ej. 3001234567"
                      autocomplete="tel"
                      required
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Contraseña</label>
                  <div class="input-group">
                    <input id="contrasena" type="password" name="contraseña" class="form-control" required />
                    <button class="btn btn-outline-secondary" type="button" onclick="alternarContrasena('contrasena', this)" aria-label="Mostrar contraseña">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirmar contraseña</label>
                  <div class="input-group">
                    <input id="confirmarContrasena" type="password" name="confirmar_contraseña" class="form-control" required />
                    <button class="btn btn-outline-secondary" type="button" onclick="alternarContrasena('confirmarContrasena', this)" aria-label="Mostrar confirmación de contraseña">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>
                <button class="btn btn-primary w-100"><i class="bi bi-person-plus me-1"></i>Registrarme</button>
                <div class="mt-3 text-center">
                  <a href="/login">Ya tengo cuenta</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      function alternarContrasena(idCampo, boton) {
        const campo = document.getElementById(idCampo);
        const visible = campo.type === "text";
        campo.type = visible ? "password" : "text";
        boton.querySelector("i").className = visible ? "bi bi-eye" : "bi bi-eye-slash";
        boton.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
      }
    </script>
  </body>
</html>
